services:
  dashboard:
    image: ghcr.io/rexx09/repo-service-dashboard:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dashboard_data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  dashboard_data:
